version: "3.8"

services:
  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: "devopspassword"
      MYSQL_DATABASE: "library"
    volumes:
      - mysql_data:/var/lib/mysql
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - mynetwork

  auth_service:
    image: harshithajam/python-code-library-app:${TAG:-latest}
    command: python auth/auth_service.py
    ports:
      - "5001:5001"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    depends_on:
      - db
    networks:
      - mynetwork

  book_service:
    image: harshithajam/python-code-library-app:${TAG:-latest}
    command: python book/book_service.py
    ports:
      - "5002:5002"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    depends_on:
      - db
    networks:
      - mynetwork

  borrow_service:
    image: harshithajam/python-code-library-app:${TAG:-latest}
    command: python borrow/borrow_service.py
    ports:
      - "5003:5003"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    depends_on:
      - db
    networks:
      - mynetwork

  frontend:
    image: harshithajam/python-code-library-app:${TAG:-latest}
    ports:
      - "5000:5000"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    depends_on:
      - auth_service
      - book_service
      - borrow_service
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge

volumes:
  mysql_data:
